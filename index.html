<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC 2026 Company Pool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        tr:hover { background-color: #1f2937; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold flex items-center gap-3">⚽ WC 2026 Company Pool</h1>
            <div class="flex gap-3">
                <button onclick="loadLiveResults()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 rounded-2xl font-medium flex items-center gap-2">
                    <i class="fas fa-sync"></i> <span id="load-btn-text">Load Latest Results</span>
                </button>
                <button onclick="resetAll()" class="px-6 py-3 bg-red-600 hover:bg-red-700 rounded-2xl font-medium flex items-center gap-2">
                    <i class="fas fa-trash"></i> Reset All
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 bg-zinc-900 rounded-3xl p-8">
                <h2 class="text-2xl font-semibold mb-6">Leaderboard <span id="match-count" class="text-sm bg-zinc-800 px-4 py-1 rounded-2xl"></span></h2>
                <table class="w-full" id="table">
                    <thead>
                        <tr class="text-zinc-400 border-b border-zinc-700">
                            <th class="py-4 text-left pl-2">Rank</th>
                            <th class="py-4 text-left">Player</th>
                            <th class="py-4 text-left">Team 1</th>
                            <th class="py-4 text-left">Team 2</th>
                            <th class="py-4 text-right pr-6">Points</th>
                        </tr>
                    </thead>
                    <tbody id="tbody" class="text-lg"></tbody>
                </table>
            </div>

            <div class="lg:col-span-5 space-y-6">
                <div class="bg-zinc-900 rounded-3xl p-6">
                    <h3 class="font-semibold mb-4">Manual Result</h3>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <select id="t1" class="bg-zinc-800 border border-zinc-700 rounded-2xl p-4"></select>
                        <select id="t2" class="bg-zinc-800 border border-zinc-700 rounded-2xl p-4"></select>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="recordResult(1)" class="flex-1 bg-emerald-600 py-4 rounded-2xl">Team 1 Wins</button>
                        <button onclick="recordResult(0)" class="flex-1 bg-amber-500 py-4 rounded-2xl">Draw</button>
                        <button onclick="recordResult(2)" class="flex-1 bg-rose-600 py-4 rounded-2xl">Team 2 Wins</button>
                    </div>
                </div>

                <div class="bg-zinc-900 rounded-3xl p-6">
                    <h3 class="font-semibold mb-4">Team Points</h3>
                    <div id="teamList" class="space-y-2 max-h-96 overflow-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const players = [ /* your full list - same as before */ 
            {name: "Kumar N", team1: "Switzerland", team2: "South Korea"},
            {name: "Paul S", team1: "Haiti", team2: "Germany"},
            {name: "Robbie M", team1: "DR Congo", team2: "Iran"},
            {name: "Paul H", team1: "Argentina", team2: "Canada"},
            {name: "John B", team1: "Portugal", team2: "Saudi Arabia"},
            {name: "Mark O", team1: "Uruguay", team2: "New Zealand"},
            {name: "Mark C", team1: "Paraguay", team2: "Curacao"},
            {name: "Raisa", team1: "Belgium", team2: "Algeria"},
            {name: "Alexie B", team1: "Qatar", team2: "Czechia"},
            {name: "Edward B", team1: "Ecuador", team2: "Cape Verde"},
            {name: "Phil H", team1: "England", team2: "Morocco"},
            {name: "Angela W", team1: "Ivory Coast", team2: "Australia"},
            {name: "Denis T", team1: "Scotland", team2: "South Korea"},
            {name: "Svilen", team1: "Colombia", team2: "Panama"},
            {name: "Beth M", team1: "Bosnia", team2: "Senegal"},
            {name: "Matthew R", team1: "Mexico", team2: "Iraq"},
            {name: "William D", team1: "Tunisia", team2: "Netherlands"},
            {name: "Volodymyr", team1: "Turkey", team2: "Ghana"},
            {name: "Alex C", team1: "Sweden", team2: "Japan"},
            {name: "Eugene", team1: "Austria", team2: "Egypt"},
            {name: "Darren", team1: "Jordan", team2: "Uzbekistan"},
            {name: "Andrea", team1: "France", team2: "USA"},
            {name: "Daniel F", team1: "Norway", team2: "Brazil"},
            {name: "James D", team1: "Croatia", team2: "Spain"}
        ];

        let teamPoints = {};
        let processed = new Set();

        const nameMap = {
            "DR Congo": "Congo DR",
            "Curacao": "Curaçao",
            "Czechia": "Czech Republic",
            "Ivory Coast": "Côte d'Ivoire",
            "Cape Verde": "Cape Verde",
            "USA": "United States",
            "Bosnia": "Bosnia & Herzegovina",
            "Turkey": "Türkiye",
            "South Korea": "Korea Republic",
            "Germany": "Germany",
            "England": "England",
            "France": "France",
            "Brazil": "Brazil",
            "Spain": "Spain",
            "Netherlands": "Netherlands",
            "Portugal": "Portugal",
            "Argentina": "Argentina",
            "Mexico": "Mexico"
        };

        function normalize(name) {
            return nameMap[name] || name.replace(/ /g, ' ').trim();
        }

        async function loadLiveResults() {
            const btn = document.getElementById('load-btn-text');
            const orig = btn.textContent;
            btn.textContent = "Loading...";

            try {
                const res = await fetch('https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json');
                const data = await res.json();

                let added = 0;

                data.matches.forEach(m => {
                    if (!m.score || !m.score.ft) return;

                    const id = `${m.team1 || ''}-${m.team2 || ''}-${m.date}`;
                    if (processed.has(id)) return;

                    const home = normalize(m.team1);
                    const away = normalize(m.team2);
                    const [h, a] = m.score.ft;

                    players.forEach(p => {
                        const t1 = normalize(p.team1);
                        const t2 = normalize(p.team2);

                        if ((t1 === home && t2 === away) || (t1 === away && t2 === home)) {
                            if (h > a) teamPoints[home] = (teamPoints[home] || 0) + 3;
                            else if (a > h) teamPoints[away] = (teamPoints[away] || 0) + 3;
                            else {
                                teamPoints[home] = (teamPoints[home] || 0) + 1;
                                teamPoints[away] = (teamPoints[away] || 0) + 1;
                            }
                            added++;
                        }
                    });

                    processed.add(id);
                });

                localStorage.setItem('wcPoints', JSON.stringify(teamPoints));
                localStorage.setItem('wcProcessed', JSON.stringify(Array.from(processed)));
                render();

                alert(`✅ Processed ${added} match results!`);
            } catch (e) {
                console.error(e);
                alert("Could not fetch results. Try again or use manual entry.");
            }

            btn.textContent = orig;
        }

        // ... rest of the functions (render, recordResult, resetAll, etc.) stay the same as previous version ...
        // (I kept the full code short here — paste the rest from your last working version)

        window.onload = () => {
            // load saved + render + try live
            const saved = localStorage.getItem('wcPoints');
            if (saved) teamPoints = JSON.parse(saved);
            const proc = localStorage.getItem('wcProcessed');
            if (proc) processed = new Set(JSON.parse(proc));

            renderSelects();
            render();
            setTimeout(loadLiveResults, 800);
        };
    </script>
</body>
</html>
